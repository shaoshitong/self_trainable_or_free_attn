      }

        apply(addHostMessageListener, nextHostPort, [
          &quot;message&quot;,
          (event) =&gt; {

  &lt;div data-slot=&quot;timeline&quot;&gt;&lt;/div&gt;

    &lt;span&gt;&lt;i class=&quot;vlb-swatch vlb-c1&quot;&gt;&lt;/i&gt;普通任务&lt;/span&gt;
    &lt;span&gt;&lt;i class=&quot;vlb-swatch vlb-c2&quot;&gt;&lt;/i&gt;热列表任务&lt;/span&gt;

  &lt;/div&gt;
  &lt;p class=&quot;text-small vlb-note&quot;&gt;教学时间单位，不是 ms，也不是 H100 benchmark。每对代价 = 1、4 个工人、chunk = 2、开销 0.5 都是简化；toy token 与任务，不代表 CUDA tile 尺寸，也不是模型质量结论。&lt;/p&gt;
  &lt;section class=&quot;vlb-measured&quot; aria-label=&quot;已有 H100 前向反向实测&quot;&gt;
    &lt;h3&gt;H100 实测 · FWD / BWD&lt;/h3&gt;
    &lt;p class=&quot;text-small vlb-note&quot;&gt;下面是此前真实测得的毫秒数，与上方教学时间轴分开。TK 未拆 → Auto C64；同时显示加速和减速。&lt;/p&gt;
    &lt;div data-slot=&quot;measured&quot;&gt;&lt;/div&gt;
    &lt;p class=&quot;text-small vlb-note&quot;&gt;H100 80GB，BF16，B1/H20/D128/K64/R16（诊断 H2/K4 另标）。固定合成选块、每组相同选中对，router 不计；含完整算子的规划、任务和合并开销。预热 3 次、计时 10 次取中位数。FWD、BWD、F+B 分别计时，F+B 不能由两个中位数相加。小幅差异不代表稳定收益；不是模型端到端加速。&lt;/p&gt;
    &lt;p class=&quot;text-small vlb-note&quot;&gt;Manual C64：双向手动拆分，scratch 上限 4 GiB；Auto C64：自动选方向，前向 partial 上限 64 MiB。拆分为 0 仍有规划开销。实际策略与上方玩具规则不同。&lt;/p&gt;
  &lt;/section&gt;
  &lt;div class=&quot;vlb-sr&quot; aria-live=&quot;polite&quot; data-slot=&quot;live&quot;&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;/section&gt;
&lt;script&gt;
(function () {
// Shared toy model: selected-pair masks, worklists, greedy timelines, router rule and the seeded D=4 numerics.
// Times are teaching units with a simplified per-pair cost; nothing here is a measurement.
function createModel() {
  const N = 8, D = 4, WORKERS = 4, CHUNK = 2, PAIR_COST = 1, PLAN_COST = 0.5, MERGE_COST = 0.5, TIME_DOMAIN = 8;
  const SEED = 20261105, EPS = 1e-12;
  const range = (n) =&gt; Array.from({ length: n }, (_, i) =&gt; i);
  const zeros = (n) =&gt; new Array(n).fill(0);
  const matrix = (rows, cols) =&gt; range(rows).map(() =&gt; zeros(cols));
  const dot = (a, b) =&gt; a.reduce((s, x, i) =&gt; s + x * b[i], 0);
  const addScaled = (out, x, c) =&gt; { for (let d = 0; d &lt; out.length; d++) out[d] += c * x[d]; };
  const sum = (xs) =&gt; xs.reduce((s, x) =&gt; s + x, 0);

  // --- masks: Q rows x KV columns, 16 selected pairs in every scene
  function transposeMask(mask) {
    const out = range(N).map(() =&gt; []);
    mask.forEach((cols, i) =&gt; cols.forEach((j) =&gt; out[j].push(i)));
    return out;
  }
  const hotQ = [range(N), [0, 1], [2], [3], [4], [5], [6], [7]];
  const MASKS = {
    uniform: range(N).map((i) =&gt; [i, (i + 1) % N].sort((a, b) =&gt; a - b)),
    hotQ,
    hotKV: transposeMask(hotQ),
    both: [range(N), [0, 1], [0], [0], [0], [0], [0], [0]],
  };
  const SCENES = [
    { id: &quot;uniform&quot;, label: &quot;均匀&quot; },
    { id: &quot;hotQ&quot;, label: &quot;热 Q&quot; },
    { id: &quot;hotKV&quot;, label: &quot;热 KV&quot; },
    { id: &quot;both&quot;, label: &quot;都热&quot; },
  ];
  const degrees = (mask) =&gt; ({ rows: mask.map((c) =&gt; c.length), cols: transposeMask(mask).map((r) =&gt; r.length) });
  const edgeCount = (mask) =&gt; sum(mask.map((c) =&gt; c.length));

  // --- worklists: F owns q rows (q-&gt;kv lists), B owns kv columns (kv-&gt;q lists)
  function selectedLists(mask, dir) {
    if (dir === &quot;F&quot;) return mask.map((cols, i) =&gt; ({ list: i, name: &quot;q&quot; + i, edges: cols.map((j) =&gt; [i, j]) }));
    return transposeMask(mask).map((rows, j) =&gt; ({ list: j, name: &quot;k&quot; + j, edges: rows.map((i) =&gt; [i, j]) }));
  }
  const makeTask = (kind, l, edges, part) =&gt; ({
    kind,
    list: l.list,
    listName: l.name,
    name: part ? l.name + &quot;#&quot; + part : l.name,
    part: part || 0,
    edges,
    cost: edges.length * PAIR_COST,
    hot: l.edges.length &gt; CHUNK,
  });
  function wholeWorklist(mask, dir) {
    return selectedLists(mask, dir).map((l) =&gt; makeTask(&quot;whole&quot;, l, l.edges));
  }
  // Heavy lists first as contiguous chunks, then one direct task per short list.
  function chunkWorklist(mask, dir) {
    const lists = selectedLists(mask, dir);
    const heavy = lists.filter((l) =&gt; l.edges.length &gt; CHUNK).sort((a, b) =&gt; b.edges.length - a.edges.length);
    const tasks = [];
    heavy.forEach((l) =&gt; {
      for (let e = 0, part = 1; e &lt; l.edges.length; e += CHUNK, part++) {
        tasks.push(makeTask(&quot;chunk&quot;, l, l.edges.slice(e, e + CHUNK), part));
      }
    });
    lists.filter((l) =&gt; l.edges.length &lt;= CHUNK).forEach((l) =&gt; tasks.push(makeTask(&quot;direct&quot;, l, l.edges)));
    return { tasks, split: heavy };
  }

  // --- greedy list scheduling; ties go to the lowest lane
  function placeGreedy(tasks, free, out) {
    tasks.forEach((task) =&gt; {
      let lane = 0;
      for (let w = 1; w &lt; free.length; w++) if (free[w] &lt; free[lane]) lane = w;
      const start = free[lane], end = start + task.cost;
      free[lane] = end;
      out.push(Object.assign({}, task, { lane, start, end }));
    });
  }
  function finishTimeline(id, tasks, splitLists) {
    const makespan = Math.max(...tasks.map((t) =&gt; t.end));
    const lanes = range(WORKERS).map((w) =&gt;
      tasks.filter((t) =&gt; t.lane === w || t.lane === -1).sort((a, b) =&gt; a.start - b.start));
    const idleSegments = [];
    lanes.forEach((tl, lane) =&gt; {
      let at = 0;
      tl.forEach((t) =&gt; { if (t.start &gt; at) idleSegments.push({ lane, start: at, end: t.start }); at = t.end; });
      if (at &lt; makespan) idleSegments.push({ lane, start: at, end: makespan });
    });
    const work = sum(tasks.filter((t) =&gt; t.edges.length).map((t) =&gt; t.cost));
    const overhead = sum(tasks.filter((t) =&gt; !t.edges.length).map((t) =&gt; (t.lane === -1 ? WORKERS : 1) * t.cost));
    const idle = sum(idleSegments.map((s) =&gt; s.end - s.start));
    const events = [...new Set(tasks.flatMap((t) =&gt; [t.start, t.end]))].sort((a, b) =&gt; a - b);
    return { id, tasks, splitLists, makespan, work, overhead, idle, idleSegments, events };
  }
  function originalTimeline(mask, dir) {
    const out = [];
    placeGreedy(wholeWorklist(mask, dir), zeros(WORKERS), out);
    return finishTimeline(&quot;orig&quot;, out, []);
  }
  // Planning is a barrier on every lane; merges or reduce-adds wait for all tasks.
  function balancedTimeline(mask, dir) {
    const { tasks, split } = chunkWorklist(mask, dir);
    const out = [{ kind: &quot;plan&quot;, name: &quot;规划&quot;, list: -1, part: 0, edges: [], cost: PLAN_COST, hot: false, lane: -1, start: 0, end: PLAN_COST }];
    const free = zeros(WORKERS).map(() =&gt; PLAN_COST);
    placeGreedy(tasks, free, out);
    const barrier = Math.max(...free);
    const merges = split.map((l) =&gt; ({
      kind: &quot;merge&quot;, name: (dir === &quot;F&quot; ? &quot;合并 &quot; : &quot;累加 &quot;) + l.name, list: l.list, listName: l.name, part: 0,
      edges: [], cost: MERGE_COST, hot: true,
    }));
    placeGreedy(merges, free.map(() =&gt; barrier), out);
    return finishTimeline(&quot;bal&quot;, out, split.map((l) =&gt; l.list));
  }

  // Per-pair progress inside a timeline: a task walks its pairs in order.
  function edgeStates(timeline, t) {
    const states = new Map();
    timeline.tasks.forEach((task) =&gt; {
      task.edges.forEach((e, k) =&gt; {
        const s = task.start + k * PAIR_COST;
        const state = t &gt;= s + PAIR_COST ? &quot;done&quot; : t &gt;= s ? &quot;running&quot; : &quot;pending&quot;;
        states.set(e[0] + &quot;,&quot; + e[1], { state, lane: task.lane });
      });
    });
    return states;
  }
  function busyLanes(timeline, t) {
    const lanes = new Set();
    timeline.tasks.forEach((task) =&gt; {
      if (t &gt;= task.start &amp;&amp; t &lt; task.end) { if (task.lane === -1) range(WORKERS).forEach((w) =&gt; lanes.add(w)); else lanes.add(task.lane); }
    });
    return lanes;
  }

  // --- toy router rule: split a direction when its longest list exceeds one worker&#x27;s fair share
  function route(mask) {
    const deg = degrees(mask), threshold = edgeCount(mask) / WORKERS;
    const rowMax = Math.max(...deg.rows), colMax = Math.max(...deg.cols);
    const F = rowMax &gt; threshold, B = colMax &gt; threshold;
    return { rowMax, colMax, threshold, F, B, name: F &amp;&amp; B ? &quot;both&quot; : F ? &quot;F only&quot; : B ? &quot;B only&quot; : &quot;unsplit&quot; };
  }
  function sceneView(id) {
    const mask = MASKS[id], routed = route(mask);
    const dirs = {};
    [&quot;F&quot;, &quot;B&quot;].forEach((dir) =&gt; { dirs[dir] = { orig: originalTimeline(mask, dir), bal: balancedTimeline(mask, dir) }; });
    const pick = (dir, split) =&gt; (split ? dirs[dir].bal : dirs[dir].orig).makespan;
    return {
      id, mask, route: routed, degrees: degrees(mask), dirs,
      totals: {
        original: pick(&quot;F&quot;, false) + pick(&quot;B&quot;, false),
        routed: pick(&quot;F&quot;, routed.F) + pick(&quot;B&quot;, routed.B),
        forced: pick(&quot;F&quot;, true) + pick(&quot;B&quot;, true),
      },
    };
  }

  // --- seeded D=4 numerics. LSE is log2 of the summed exponentials, as in docs/vsa2_splitkv.md.
  function mulberry32(seed) {
    let a = seed &gt;&gt;&gt; 0;
    return () =&gt; {
      a = (a + 0x6d2b79f5) &gt;&gt;&gt; 0;
      let t = a;
      t = Math.imul(t ^ (t &gt;&gt;&gt; 15), t | 1);
      t ^= t + Math.imul(t ^ (t &gt;&gt;&gt; 7), t | 61);
      return ((t ^ (t &gt;&gt;&gt; 14)) &gt;&gt;&gt; 0) / 4294967296;
    };
  }
  function seededTensors(seed, scale) {
    const rand = mulberry32(seed), s = scale === undefined ? 1 : scale;
    const tensor = (c) =&gt; range(N).map(() =&gt; range(D).map(() =&gt; (rand() * 2 - 1) * c));
    return { Q: tensor(1.2 * s), K: tensor(1.2 * s), V: tensor(1), G: tensor(1) };
  }
  function log2SumExp(values) {
    const m = Math.max(...values);
    return (m + Math.log(sum(values.map((v) =&gt; Math.exp(v - m))))) / Math.LN2;
  }
  function attend(S, cols, V) {
    const m = Math.max(...S), O = zeros(D);
    let total = 0;
    S.forEach((s, c) =&gt; { const w = Math.exp(s - m); total += w; addScaled(O, V[cols[c]], w); });
    return { O: O.map((x) =&gt; x / total), LSE: log2SumExp(S) };
  }
  // Independent reference: a dense 8x8 softmax with -Infinity on unselected pairs.
  function fullMaskedSoftmax({ Q, K, V }, mask) {
    return Q.map((q, i) =&gt; {
      const S = K.map((k, j) =&gt; (mask[i].includes(j) ? dot(q, k) : -Infinity));
      const m = Math.max(...S), w = S.map((s) =&gt; Math.exp(s - m)), total = sum(w);
      const O = zeros(D);
      w.forEach((x, j) =&gt; addScaled(O, V[j], x / total));
      return { O, LSE: (m + Math.log(total)) / Math.LN2 };
    });
  }
  // q rows longer than `chunk`: partial O + LSE per chunk, then the stable merge at M = max LSE.
  function forwardChunked({ Q, K, V }, mask, chunk) {
    return mask.map((cols, i) =&gt; {
      const S = cols.map((j) =&gt; dot(Q[i], K[j]));
      if (cols.length &lt;= chunk) return Object.assign(attend(S, cols, V), { parts: null });
      const parts = [];
      for (let c = 0; c &lt; cols.length; c += chunk) {
        const sub = cols.slice(c, c + chunk);
        parts.push(Object.assign(attend(S.slice(c, c + chunk), sub, V), { cols: sub }));
      }
      const M = Math.max(...parts.map((p) =&gt; p.LSE));
      const weights = parts.map((p) =&gt; Math.pow(2, p.LSE - M));
      const total = sum(weights), O = zeros(D);
      parts.forEach((p, c) =&gt; addScaled(O, p.O, weights[c] / total));
      return { O, LSE: M + Math.log2(total), parts, weights, M, total };
    });
  }
  // Loss L = sum_id G_id O_id. Reference gradients walk q rows directly with one softmax per row.
  function gradientReference({ Q, K, V, G }, mask) {
    const dQ = matrix(N, D), dK = matrix(N, D), dV = matrix(N, D);
    mask.forEach((cols, i) =&gt; {
      const S = cols.map((j) =&gt; dot(Q[i], K[j]));
      const m = Math.max(...S), w = S.map((s) =&gt; Math.exp(s - m)), total = sum(w);
      const P = w.map((x) =&gt; x / total), O = zeros(D);
      cols.forEach((j, c) =&gt; addScaled(O, V[j], P[c]));
      cols.forEach((j, c) =&gt; {
        const A = P[c] * (dot(G[i], V[j]) - dot(G[i], O));
        addScaled(dV[j], G[i], P[c]);
        addScaled(dK[j], Q[i], A);
        addScaled(dQ[i], K[j], A);
      });
    });
    return { dQ, dK, dV };
  }
  // KV-owner backward: k2q chunks read the saved global LSE and O, and only add their contributions.
  function backwardChunked(tensors, mask, saved, chunk) {
    const { Q, K, V, G } = tensors;
    const dQ = matrix(N, D), dK = matrix(N, D), dV = matrix(N, D), columns = [];
    transposeMask(mask).forEach((rows, j) =&gt; {
      const size = rows.length &gt; chunk ? chunk : Math.max(rows.length, 1), parts = [];
      for (let c = 0; c &lt; rows.length; c += size) {
        const sub = rows.slice(c, c + size), P = [], cdV = zeros(D);
        sub.forEach((i) =&gt; {
          const p = Math.exp(dot(Q[i], K[j]) - saved[i].LSE * Math.LN2);
          const A = p * (dot(G[i], V[j]) - dot(G[i], saved[i].O));
          P.push(p);
          addScaled(cdV, G[i], p);
          addScaled(dK[j], Q[i], A);
          addScaled(dQ[i], K[j], A);
        });
        addScaled(dV[j], cdV, 1);
        parts.push({ rows: sub, P, dV: cdV });
      }
      columns.push({ list: j, parts, split: rows.length &gt; chunk });
    });
    return { dQ, dK, dV, columns };
  }
  // The tempting wrong path: normalize each column chunk on its own instead of using the saved softmax.
  function independentChunkDV({ Q, K, G }, rows, j, chunk) {
    const out = zeros(D);
    for (let c = 0; c &lt; rows.length; c += chunk) {
      const sub = rows.slice(c, c + chunk);
      const S = sub.map((i) =&gt; dot(Q[i], K[j]));
      const m = Math.max(...S), w = S.map((s) =&gt; Math.exp(s - m)), total = sum(w);
      sub.forEach((i, k) =&gt; addScaled(out, G[i], w[k] / total));
    }
    return out;
  }
  function maxAbsDiff(a, b) {
    if (typeof a === &quot;number&quot;) return Math.abs(a - b);
    return Math.max(...a.map((x, i) =&gt; maxAbsDiff(x, b[i])));
  }
  function numericExample(id, opts) {
    const o = opts || {}, chunk = o.chunk || CHUNK, mask = MASKS[id];
    const tensors = seededTensors(o.seed === undefined ? SEED : o.seed, o.scale);
    const ref = fullMaskedSoftmax(tensors, mask), fwd = forwardChunked(tensors, mask, chunk);
    const refGrad = gradientReference(tensors, mask), bwd = backwardChunked(tensors, mask, fwd, chunk);
    const forwardDelta = Math.max(maxAbsDiff(fwd.map((r) =&gt; r.O), ref.map((r) =&gt; r.O)), maxAbsDiff(fwd.map((r) =&gt; r.LSE), ref.map((r) =&gt; r.LSE)));
    const backwardDelta = Math.max(maxAbsDiff(bwd.dQ, refGrad.dQ), maxAbsDiff(bwd.dK, refGrad.dK), maxAbsDiff(bwd.dV, refGrad.dV));
    const splitRow = fwd.findIndex((r) =&gt; r.parts);
    const splitCol = bwd.columns.findIndex((c) =&gt; c.split);
    const unweightedDelta = splitRow &lt; 0 ? null : maxAbsDiff(
      fwd[splitRow].parts.reduce((acc, p) =&gt; { addScaled(acc, p.O, 1 / fwd[splitRow].parts.length); return acc; }, zeros(D)),
      ref[splitRow].O);
    const independent = splitCol &lt; 0 ? null : independentChunkDV(tensors, transposeMask(mask)[splitCol], splitCol, chunk);
    return {
      tensors, ref, fwd, refGrad, bwd, forwardDelta, backwardDelta, splitRow, splitCol, unweightedDelta,
      independentDelta: independent ? maxAbsDiff(independent, refGrad.dV[splitCol]) : null,
    };
  }

  return {
    N, D, WORKERS, CHUNK, PAIR_COST, PLAN_COST, MERGE_COST, TIME_DOMAIN, SEED, EPS, SCENES, MASKS,
    range, degrees, edgeCount, transposeMask, selectedLists, wholeWorklist, chunkWorklist,
    originalTimeline, balancedTimeline, edgeStates, busyLanes, route, sceneView,
    seededTensors, fullMaskedSoftmax, forwardChunked, gradientReference, backwardChunked, numericExample, maxAbsDiff,
  };

    // Chunk outlines appear only while following the balanced timeline.
    if (state.follow === &quot;bal&quot;) {
      tl.bal.tasks.filter((t) =&gt; t.kind === &quot;chunk&quot;).forEach((t) =&gt; {
        const is = t.edges.map((e) =&gt; e[0]), js = t.edges.map((e) =&gt; e[1]);
        const x0 = Math.min(...js), x1 = Math.max(...js), y0 = Math.min(...is), y1 = Math.max(...is);
        out.push(&#x27;&lt;rect x=&quot;&#x27; + (left + x0 * cell + 0.5) + &#x27;&quot; y=&quot;&#x27; + (top + y0 * cell + 0.5) + &#x27;&quot; width=&quot;&#x27; + ((x1 - x0 + 1) * cell - 1) + &#x27;&quot; height=&quot;&#x27; + ((y1 - y0 + 1) * cell - 1) + &#x27;&quot; rx=&quot;3&quot; class=&quot;vlb-outline&quot;/&gt;&#x27;);
      });
    }
    return &#x27;&lt;svg class=&quot;vlb-svg&quot; role=&quot;img&quot; aria-label=&quot;8 行 Q、8 列 KV 的选中对矩阵，行度 &#x27; + deg.rows.join(&quot;,&quot;) + &quot;，列度 &quot; + deg.cols.join(&quot;,&quot;) + &#x27;&quot; width=&quot;&#x27; + w + &#x27;&quot; height=&quot;&#x27; + h + &#x27;&quot; viewBox=&quot;0 0 &#x27; + w + &quot; &quot; + h + &#x27;&quot;&gt;&#x27; + out.join(&quot;&quot;) + &quot;&lt;/svg&gt;&quot;;
  }

  // --- router
  function renderRouter() {
    const v = scene(), r = v.route, t = v.totals;
    const pills = [&quot;F only&quot;, &quot;B only&quot;, &quot;both&quot;, &quot;unsplit&quot;].map((n) =&gt;

    const line = (axis, max, split, tag) =&gt; axis + &quot; max &quot; + max + (split ? &quot; &gt; &quot; : &quot; ≤ &quot;) + fmt(r.threshold) + &quot; → &quot; + (split ? &quot;拆 &quot; : &quot;不拆 &quot;) + tag;
    const forced = t.forced !== t.routed ? &quot;，强制全拆反例 &quot; + fmt(t.forced) : &quot;&quot;;
    slots.router.innerHTML =
      &#x27;&lt;div class=&quot;vlb-route&quot;&gt;&lt;div class=&quot;vlb-pills&quot;&gt;&lt;span&gt;玩具 Router&lt;/span&gt;&#x27; + pills + &quot;&lt;/div&gt;&quot; +
      &#x27;&lt;div class=&quot;tabular-nums&quot;&gt;&#x27; + line(&quot;行&quot;, r.rowMax, r.F, &quot;F&quot;) + &quot;；&quot; + line(&quot;列&quot;, r.colMax, r.B, &quot;B&quot;) + &quot;&lt;/div&gt;&quot; +
      &#x27;&lt;div class=&quot;text-small tabular-nums vlb-small&quot;&gt;玩具 F+B &#x27; + fmt(t.original) + &quot; → &quot; + fmt(t.routed) + forced + &quot; 教学时间单位&lt;/div&gt;&quot; +
      &#x27;&lt;div class=&quot;text-small vlb-small&quot; data-note=&quot;router&quot;&gt;玩具规则：max 度 &gt; 16 对 / 4 工人 = 4；此处未计 router/统计开销。真实 auto 看 per-head 相对均值、全局工作量和 heavy-row 预算，全 direct 决策也有 GPU 规划/launch 开销。&lt;/div&gt;&lt;/div&gt;&#x27;;
  }

  // --- numeric merge and gradient panel
  const pending = (reveal) =&gt; &#x27; data-reveal=&quot;&#x27; + reveal + &#x27;&quot;&#x27;;
  function renderMath() {
    const n = numerics[state.scene], bal = timelines().bal;
    const endOf = (name) =&gt; bal.tasks.find((t) =&gt; t.name === name).end;
    const cell = (s, reveal, cls) =&gt; &quot;&lt;span&quot; + (reveal === undefined ? &quot;&quot; : pending(reveal)) + (cls ? &#x27; class=&quot;&#x27; + cls + &#x27;&quot;&#x27; : &quot;&quot;) + &quot;&gt;&quot; + s + &quot;&lt;/span&gt;&quot;;
    let html;
    if (state.dir === &quot;F&quot;) {
      const row = n.splitRow;
      const ok = &#x27;&lt;div class=&quot;tabular-nums&quot;&gt;✓ 输出等价 · 与全量 masked softmax 相比 max|Δ| = &#x27; + delta(n.forwardDelta) + &quot;&lt;/div&gt;&quot;;
      if (row &lt; 0) {
        html = &#x27;&lt;div class=&quot;text-small vlb-small&quot;&gt;没有超过 chunk = &#x27; + CHUNK + &quot; 的行 → 直接路径，无需合并&lt;/div&gt;&quot; + ok;
      } else {
        const r = n.fwd[row], mergeEnd = endOf(&quot;合并 q&quot; + row);
        const rows = r.parts.map((p, c) =&gt; {
          const end = endOf(&quot;q&quot; + row + &quot;#&quot; + (c + 1));
          return cell(&quot;q&quot; + row + &quot;#&quot; + (c + 1), end) + cell(vec(p.O), end) + cell(num(p.LSE), end) + cell(num(r.weights[c]), end);
        }).join(&quot;&quot;);
        html = &#x27;&lt;div class=&quot;vlb-math text-small tabular-nums&quot;&gt;&#x27; +
          cell(&quot;chunk&quot;, undefined, &quot;vlb-dim&quot;) + cell(&quot;partial O (D=4)&quot;, undefined, &quot;vlb-dim&quot;) + cell(&quot;LSE&quot;, undefined, &quot;vlb-dim&quot;) + cell(&quot;w&quot;, undefined, &quot;vlb-dim&quot;) + rows +
          &#x27;&lt;div class=&quot;vlb-rule&quot;&gt;&lt;/div&gt;&#x27; +
          cell(&quot;合并&quot;, mergeEnd) + cell(vec(r.O), mergeEnd) + cell(num(r.LSE), mergeEnd) + cell(&quot;Σ &quot; + num(r.total), mergeEnd) +
          cell(&quot;全量&quot;, mergeEnd) + cell(vec(n.ref[row].O), mergeEnd) + cell(num(n.ref[row].LSE), mergeEnd) + cell(&quot;✓&quot;, mergeEnd) +
          &quot;&lt;/div&gt;&quot; + ok +
          &#x27;&lt;div class=&quot;text-small vlb-small&quot;&gt;✗ 不按 w 加权：max|Δ| = &#x27; + num(n.unweightedDelta) + &quot;&lt;/div&gt;&quot;;
      }
    } else {
      const col = n.splitCol;
      const ok = &#x27;&lt;div class=&quot;tabular-nums&quot;&gt;✓ 梯度等价 · dQ dK dV 与全局参考相比 max|Δ| = &#x27; + delta(n.backwardDelta) + &quot;&lt;/div&gt;&quot;;
      if (col &lt; 0) {
        html = &#x27;&lt;div class=&quot;text-small vlb-small&quot;&gt;没有超过 chunk = &#x27; + CHUNK + &quot; 的列 → 直接路径，读保存的全局 P&lt;/div&gt;&quot; + ok;
      } else {
        const parts = n.bwd.columns[col].parts, mergeEnd = endOf(&quot;累加 k&quot; + col);
        const rows = parts.map((p, c) =&gt; {
          const end = endOf(&quot;k&quot; + col + &quot;#&quot; + (c + 1));
          return cell(&quot;k&quot; + col + &quot;#&quot; + (c + 1), end) + cell(p.P.map((x) =&gt; num(x)).join(&quot; &quot;), end) + cell(vec(p.dV), end);
        }).join(&quot;&quot;);
        html = &#x27;&lt;div class=&quot;vlb-math vlb-math-b text-small tabular-nums&quot;&gt;&#x27; +
          cell(&quot;chunk&quot;, undefined, &quot;vlb-dim&quot;) + cell(&quot;全局 P&quot;, undefined, &quot;vlb-dim&quot;) + cell(&quot;dV 贡献 (D=4)&quot;, undefined, &quot;vlb-dim&quot;) + rows +
          &#x27;&lt;div class=&quot;vlb-rule&quot;&gt;&lt;/div&gt;&#x27; +
          cell(&quot;Σ 累加&quot;, mergeEnd) + cell(&quot;&quot;, mergeEnd) + cell(vec(n.bwd.dV[col]), mergeEnd) +
          cell(&quot;参考&quot;, mergeEnd) + cell(&quot;✓&quot;, mergeEnd) + cell(vec(n.refGrad.dV[col]), mergeEnd) +
          &quot;&lt;/div&gt;&quot; + ok +
          &#x27;&lt;div class=&quot;text-small vlb-small&quot;&gt;✗ 每个 chunk 各做 softmax：max|Δ| = &#x27; + num(n.independentDelta) + &quot;&lt;/div&gt;&quot;;
      }
    }
    slots.math.innerHTML = &#x27;&lt;div class=&quot;vlb-route&quot;&gt;&#x27; + html + &quot;&lt;/div&gt;&quot;;
  }

  // --- aligned timelines on one axis
  function timelineSvg(w) {
    const mL = 26, mR = 8, laneH = 22, laneGap = 2, titleH = 20, panelGap = 10;
    const lanesH = WORKERS * (laneH + laneGap) - laneGap;
    const unit = (w - mL - mR) / TIME_DOMAIN;
    const x = (t) =&gt; mL + t * unit;
    const tls = timelines(), split = routedSplit();
    const out = [&#x27;&lt;defs&gt;&lt;pattern id=&quot;vlb-hatch&quot; width=&quot;5&quot; height=&quot;5&quot; patternUnits=&quot;userSpaceOnUse&quot; patternTransform=&quot;rotate(45)&quot;&gt;&lt;rect width=&quot;2&quot; height=&quot;5&quot; class=&quot;vlb-neutral&quot;/&gt;&lt;/pattern&gt;&lt;/defs&gt;&#x27;];
    const change = tls.bal.makespan - tls.orig.makespan;
    const changeText = change === 0 ? &quot;&quot; : &quot;（&quot; + (change &gt; 0 ? &quot;+&quot; : &quot;−&quot;) + fmt(Math.abs(change)) + &quot;）&quot;;
    const panels = [
      { tl: tls.orig, long: &quot;原始整表 · 完工 &quot; + fmt(tls.orig.makespan) + &quot; · 空闲 &quot; + fmt(tls.orig.idle), short: &quot;原始 完工 &quot; + fmt(tls.orig.makespan) + &quot; 空闲 &quot; + fmt(tls.orig.idle) },
      {
        tl: tls.bal,
        long: (split ? &quot;均衡 chunk&quot; : &quot;强制 chunk 反例（玩具 Router 未选）&quot;) + &quot; · 完工 &quot; + fmt(tls.bal.makespan) + changeText + &quot; · 空闲 &quot; + fmt(tls.bal.idle),
        short: (split ? &quot;均衡&quot; : &quot;强制反例&quot;) + &quot; 完工 &quot; + fmt(tls.bal.makespan) + changeText + &quot; 空闲 &quot; + fmt(tls.bal.idle),
      },
    ];
    let y = 0;
    const lanesTop = [];
    panels.forEach((p, pi) =&gt; {
      const statusMax = textWidth(&quot;工作 4/4 · 16/16 对&quot;);
      const narrow = textWidth(p.long) + statusMax + 8 &gt; w;
      out.push(&#x27;&lt;text x=&quot;0&quot; y=&quot;&#x27; + (y + 14) + &#x27;&quot;&gt;&#x27; + (narrow ? p.short : p.long) + &quot;&lt;/text&gt;&quot;);
      out.push(&#x27;&lt;text data-status=&quot;&#x27; + pi + &#x27;&quot; data-narrow=&quot;&#x27; + narrow + &#x27;&quot; x=&quot;&#x27; + (w - 1) + &#x27;&quot; y=&quot;&#x27; + (y + 14) + &#x27;&quot; text-anchor=&quot;end&quot; class=&quot;vlb-tm&quot;&gt;&lt;/text&gt;&#x27;);
      const top = y + titleH;
      lanesTop.push(top);
      model.range(WORKERS).forEach((lane) =&gt; {
        const ly = top + lane * (laneH + laneGap);
        out.push(&#x27;&lt;rect x=&quot;&#x27; + mL + &#x27;&quot; y=&quot;&#x27; + ly + &#x27;&quot; width=&quot;&#x27; + (w - mL - mR) + &#x27;&quot; height=&quot;&#x27; + laneH + &#x27;&quot; class=&quot;vlb-track&quot; fill-opacity=&quot;0.45&quot;/&gt;&#x27;);
        out.push(&#x27;&lt;text data-lane-label=&quot;&#x27; + pi + &quot;,&quot; + lane + &#x27;&quot; x=&quot;&#x27; + (mL - 4) + &#x27;&quot; y=&quot;&#x27; + (ly + 15) + &#x27;&quot; text-anchor=&quot;end&quot;&gt;W&#x27; + (lane + 1) + &quot;&lt;/text&gt;&quot;);
      });
      p.tl.idleSegments.forEach((s) =&gt; {
        const ly = top + s.lane * (laneH + laneGap), sx = x(s.start), sw = (s.end - s.start) * unit;
        out.push(&#x27;&lt;rect x=&quot;&#x27; + sx + &#x27;&quot; y=&quot;&#x27; + ly + &#x27;&quot; width=&quot;&#x27; + sw + &#x27;&quot; height=&quot;&#x27; + laneH + &#x27;&quot; fill=&quot;url(#vlb-hatch)&quot; fill-opacity=&quot;0.3&quot;/&gt;&#x27;);
        out.push(&#x27;&lt;rect data-idle=&quot;&#x27; + pi + &#x27;&quot; data-start=&quot;&#x27; + s.start + &#x27;&quot; data-end=&quot;&#x27; + s.end + &#x27;&quot; x=&quot;&#x27; + sx + &#x27;&quot; y=&quot;&#x27; + ly + &#x27;&quot; width=&quot;0&quot; height=&quot;&#x27; + laneH + &#x27;&quot; fill=&quot;url(#vlb-hatch)&quot; fill-opacity=&quot;0.8&quot;/&gt;&#x27;);
        if (sw &gt;= 34) out.push(&#x27;&lt;text x=&quot;&#x27; + (sx + sw / 2) + &#x27;&quot; y=&quot;&#x27; + (ly + 15) + &#x27;&quot; text-anchor=&quot;middle&quot; class=&quot;vlb-tm&quot;&gt;空闲&lt;/text&gt;&#x27;);
      });
      p.tl.tasks.forEach((t) =&gt; {
        const isPlan = t.lane === -1;
        const ly = isPlan ? top : top + t.lane * (laneH + laneGap);
        const h = isPlan ? lanesH : laneH;
        const tx = x(t.start) + 0.5, tw = (t.end - t.start) * unit - 1;
        const cls = t.kind === &quot;plan&quot; || t.kind === &quot;merge&quot; ? &quot;vlb-over&quot; : t.hot ? &quot;vlb-hot&quot; : &quot;vlb-work&quot;;
        const tip = t.name + &quot; · W&quot; + (isPlan ? &quot;1-4&quot; : t.lane + 1) + &quot; · &quot; + fmt(t.start) + &quot;–&quot; + fmt(t.end) + &quot; 单位&quot;;
        out.push(&#x27;&lt;rect x=&quot;&#x27; + tx + &#x27;&quot; y=&quot;&#x27; + ly + &#x27;&quot; width=&quot;&#x27; + tw + &#x27;&quot; height=&quot;&#x27; + h + &#x27;&quot; rx=&quot;2&quot; class=&quot;&#x27; + cls + &#x27;&quot; fill-opacity=&quot;0.22&quot; data-tooltip=&quot;&#x27; + tip + &#x27;&quot;/&gt;&#x27;);
        out.push(&#x27;&lt;rect data-fill=&quot;&#x27; + pi + &#x27;&quot; data-start=&quot;&#x27; + t.start + &#x27;&quot; data-end=&quot;&#x27; + t.end + &#x27;&quot; x=&quot;&#x27; + tx + &#x27;&quot; y=&quot;&#x27; + ly + &#x27;&quot; width=&quot;0&quot; height=&quot;&#x27; + h + &#x27;&quot; rx=&quot;2&quot; class=&quot;&#x27; + cls + &#x27;&quot; fill-opacity=&quot;0.6&quot;/&gt;&#x27;);
        const cx = tx + tw / 2;
        if (isPlan) {
          if (tw &gt;= 13) [&quot;规&quot;, &quot;划&quot;].forEach((ch, k) =&gt; out.push(&#x27;&lt;text x=&quot;&#x27; + cx + &#x27;&quot; y=&quot;&#x27; + (ly + lanesH / 2 - 2 + k * 14) + &#x27;&quot; text-anchor=&quot;middle&quot;&gt;&#x27; + ch + &quot;&lt;/text&gt;&quot;));
          return;
        }
        const longLabel = t.kind === &quot;whole&quot; &amp;&amp; t.hot ? t.name + &quot; 整表 &quot; + t.edges.length + &quot; 对&quot; : t.name;
        const shortLabel = t.kind === &quot;merge&quot; ? (state.dir === &quot;F&quot; ? &quot;合&quot; : &quot;Σ&quot;) : t.name;
        const label = textWidth(longLabel) &lt;= tw - 4 ? longLabel : textWidth(shortLabel) &lt;= tw - 2 ? shortLabel : &quot;&quot;;
        if (label) out.push(&#x27;&lt;text x=&quot;&#x27; + cx + &#x27;&quot; y=&quot;&#x27; + (ly + 15) + &#x27;&quot; text-anchor=&quot;middle&quot;&gt;&#x27; + label + &quot;&lt;/text&gt;&quot;);
      });
      out.push(&#x27;&lt;line x1=&quot;&#x27; + x(p.tl.makespan) + &#x27;&quot; x2=&quot;&#x27; + x(p.tl.makespan) + &#x27;&quot; y1=&quot;&#x27; + (top - 1) + &#x27;&quot; y2=&quot;&#x27; + (top + lanesH + 1) + &#x27;&quot; class=&quot;vlb-finish&quot;/&gt;&#x27;);
      y = top + lanesH + panelGap;
    });
    const axisY = y - panelGap + 4;
    out.push(&#x27;&lt;line x1=&quot;&#x27; + mL + &#x27;&quot; x2=&quot;&#x27; + (w - mR) + &#x27;&quot; y1=&quot;&#x27; + axisY + &#x27;&quot; y2=&quot;&#x27; + axisY + &#x27;&quot; class=&quot;vlb-grid&quot;/&gt;&#x27;);
    const step = unit &gt;= 44 ? 1 : 2;
    for (let t = 0; t &lt;= TIME_DOMAIN; t += step) {
      out.push(&#x27;&lt;line x1=&quot;&#x27; + x(t) + &#x27;&quot; x2=&quot;&#x27; + x(t) + &#x27;&quot; y1=&quot;&#x27; + axisY + &#x27;&quot; y2=&quot;&#x27; + (axisY + 3) + &#x27;&quot; class=&quot;vlb-grid&quot;/&gt;&#x27;);
      out.push(&#x27;&lt;text x=&quot;&#x27; + x(t) + &#x27;&quot; y=&quot;&#x27; + (axisY + 15) + &#x27;&quot; text-anchor=&quot;&#x27; + (t === TIME_DOMAIN ? &quot;end&quot; : &quot;middle&quot;) + &#x27;&quot; class=&quot;vlb-tm&quot;&gt;&#x27; + t + &quot;&lt;/text&gt;&quot;);
    }
    out.push(&#x27;&lt;text x=&quot;&#x27; + (mL + (w - mL - mR) / 2) + &#x27;&quot; y=&quot;&#x27; + (axisY + 30) + &#x27;&quot; text-anchor=&quot;middle&quot; class=&quot;vlb-tm&quot;&gt;教学时间单位（非 ms）&lt;/text&gt;&#x27;);
    out.push(&#x27;&lt;line data-playhead x1=&quot;&#x27; + mL + &#x27;&quot; x2=&quot;&#x27; + mL + &#x27;&quot; y1=&quot;&#x27; + lanesTop[0] + &#x27;&quot; y2=&quot;&#x27; + axisY + &#x27;&quot; class=&quot;vlb-head-line&quot;/&gt;&#x27;);
    const h = axisY + 36;
    const label = &quot;4 个工人的对齐时间线：原始完工 &quot; + fmt(tls.orig.makespan) + &quot;，&quot; + chunkName() + &quot;完工 &quot; + fmt(tls.bal.makespan) + &quot;，教学时间单位&quot;;
    return &#x27;&lt;svg class=&quot;vlb-svg&quot; role=&quot;img&quot; aria-label=&quot;&#x27; + label + &#x27;&quot; width=&quot;&#x27; + w + &#x27;&quot; height=&quot;&#x27; + h + &#x27;&quot; viewBox=&quot;0 0 &#x27; + w + &quot; &quot; + h + &#x27;&quot;&gt;&#x27; + out.join(&quot;&quot;) + &quot;&lt;/svg&gt;&quot;;
  }

  // --- build and paint
  function collectMarks() {
    const readRange = (el) =&gt; ({ el, start: Number(el.getAttribute(&quot;data-start&quot;)), end: Number(el.getAttribute(&quot;data-end&quot;)), w: 0 });
    const all = (sel) =&gt; Array.from(root.querySelectorAll(sel));
    const tl = slots.timeline.querySelector(&quot;svg&quot;);
    const vb = tl.getAttribute(&quot;viewBox&quot;).split(&quot; &quot;).map(Number);
    const mL = 26, mR = 8;
    const unit = (vb[2] - mL - mR) / TIME_DOMAIN;
    marks = {
      unit,
      mL,
      playhead: root.querySelector(&quot;[data-playhead]&quot;),
      fills: [0, 1].map((p) =&gt; all(&#x27;[data-fill=&quot;&#x27; + p + &#x27;&quot;]&#x27;).map((el) =&gt; {
        const m = readRange(el);
        m.w = (m.end - m.start) * unit - 1;
        return m;
      })),
      idles: [0, 1].map((p) =&gt; all(&#x27;[data-idle=&quot;&#x27; + p + &#x27;&quot;]&#x27;).map((el) =&gt; {
        const m = readRange(el);
        m.w = (m.end - m.start) * unit;
        return m;
      })),
      cells: all(&quot;[data-cell]&quot;).map((el) =&gt; {
        const key = el.getAttribute(&quot;data-cell&quot;);
        return { el, key, text: root.querySelector(&#x27;[data-cell-text=&quot;&#x27; + key + &#x27;&quot;]&#x27;) };
      }),
      status: all(&quot;[data-status]&quot;),
      laneLabels: all(&quot;[data-lane-label]&quot;).map((el) =&gt; {
        const parts = el.getAttribute(&quot;data-lane-label&quot;).split(&quot;,&quot;).map(Number);
        return { el, panel: parts[0], lane: parts[1] };
      }),
      tokens: all(&quot;[data-phase]&quot;),
      reveals: all(&quot;[data-reveal]&quot;).map((el) =&gt; ({ el, at: Number(el.getAttribute(&quot;data-reveal&quot;)) })),
    };
  }
  function phaseAt(t) {
    const tl = routedSplit() ? timelines().bal : timelines().orig;
    if (t &lt;= 0) return &quot;&quot;;
    if (t &gt;= tl.makespan) return &quot;done&quot;;
    const active = tl.tasks.find((k) =&gt; t &gt;= k.start &amp;&amp; t &lt; k.end &amp;&amp; k.kind === &quot;plan&quot;);
    if (active) return &quot;plan&quot;;
    return tl.tasks.some((k) =&gt; k.kind === &quot;merge&quot; &amp;&amp; t &gt;= k.start &amp;&amp; t &lt; k.end) ? &quot;merge&quot; : &quot;work&quot;;
  }
  function paint() {
    const t = state.t, tls = [timelines().orig, timelines().bal];
    marks.fills.forEach((list) =&gt; list.forEach((m) =&gt; m.el.setAttribute(&quot;width&quot;, clamp01((t - m.start) / (m.end - m.start)) * m.w)));
    marks.idles.forEach((list) =&gt; list.forEach((m) =&gt; m.el.setAttribute(&quot;width&quot;, clamp01((t - m.start) / (m.end - m.start)) * m.w)));
    const px = marks.mL + t * marks.unit;
    marks.playhead.setAttribute(&quot;x1&quot;, px);
    marks.playhead.setAttribute(&quot;x2&quot;, px);
    const followed = state.follow === &quot;orig&quot; ? tls[0] : tls[1];
    const edges = model.edgeStates(followed, t);
    marks.cells.forEach((c) =&gt; {
      const e = edges.get(c.key);
      const running = e.state === &quot;running&quot;;
      c.el.setAttribute(&quot;fill-opacity&quot;, running ? 0.75 : e.state === &quot;done&quot; ? 0.4 : 0.14);
      const cls = c.el.getAttribute(&quot;class&quot;).replace(&quot; vlb-running&quot;, &quot;&quot;);
      c.el.setAttribute(&quot;class&quot;, running ? cls + &quot; vlb-running&quot; : cls);
      c.text.textContent = running ? &quot;W&quot; + (e.lane + 1) : e.state === &quot;done&quot; ? &quot;✓&quot; : &quot;·&quot;;
